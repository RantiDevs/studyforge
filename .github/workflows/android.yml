name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-app/**"
      - ".github/workflows/android.yml"
      - "public/icons/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Add notification permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          for p in POST_NOTIFICATIONS RECEIVE_BOOT_COMPLETED; do
            grep -q "android.permission.$p" "$M" || sed -i "s|</manifest>|    <uses-permission android:name=\"android.permission.$p\" />\n</manifest>|" "$M"
          done
          grep -n "uses-permission" "$M"

      - name: Use StudyForge icon
        run: |
          for d in android/app/src/main/res/mipmap-*; do
            case "$d" in *anydpi*) rm -rf "$d"; continue;; esac
            cp ../public/icons/icon-512.png "$d/ic_launcher.png"
            cp ../public/icons/icon-512.png "$d/ic_launcher_round.png"
            cp ../public/icons/icon-512.png "$d/ic_launcher_foreground.png"
          done

      - name: Sync
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StudyForge-debug-apk
          path: android-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
